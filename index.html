<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBoard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root[data-theme="dark"] {
            --bg-color: #121212; --tool-bg: rgba(30, 30, 30, 0.85); --text-color: #ffffff;
            --border-color: #333; --accent: #0078d4;
        }
        :root[data-theme="light"] {
            --bg-color: #f3f3f3; --tool-bg: rgba(255, 255, 255, 0.85); --text-color: #000000;
            --border-color: #ccc; --accent: #005a9e;
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none;
        }
        #drag-region { -webkit-app-region: drag; height: 30px; width: 100%; position: absolute; top: 0; z-index: 1000; }
        
        #dashboard {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color); z-index: 2000; display: flex;
            justify-content: center; align-items: center; transition: opacity 0.3s;
        }
        #dashboard.hidden { opacity: 0; pointer-events: none; }
        .dash-content { text-align: center; max-width: 600px; width: 100%; }
        .dash-buttons button { margin: 10px; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: 1px solid var(--border-color); background: var(--tool-bg); color: var(--text-color); transition: 0.2s; }
        .dash-buttons button:hover { background: var(--accent); color: white; }
        #dash-recent { list-style: none; padding: 0; text-align: left; background: var(--tool-bg); border-radius: 8px; border: 1px solid var(--border-color); }
        #dash-recent li { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; }
        #dash-recent li:hover { background: rgba(128,128,128,0.2); }
        
        #toolbar {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            background: var(--tool-bg); backdrop-filter: blur(12px);
            padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border-color);
            display: flex; gap: 8px; z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,0.2); align-items: center;
        }
        .btn {
            background: transparent; color: var(--text-color); border: none;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: rgba(128, 128, 128, 0.2); }
        .btn:active { transform: scale(0.95); }
        .btn.active { background: var(--accent); color: #fff; }
        .separator { width: 1px; height: 24px; background: var(--border-color); margin: 0 5px; }
        input[type="color"] { background: none; border: none; cursor: pointer; height: 30px; width: 30px; padding: 0; }
        input[type="range"] { accent-color: var(--accent); width: 80px; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="drag-region"></div>
    
    <div id="dashboard">
        <div class="dash-content">
            <h1 style="font-size: 3rem; margin-bottom: 30px;"><i class="fa-solid fa-chalkboard"></i> SmartBoard</h1>
            <div class="dash-buttons">
                <button id="dash-new"><i class="fa-solid fa-plus"></i> New Board</button>
                <button id="dash-load"><i class="fa-solid fa-folder-open"></i> Load Board</button>
            </div>
            <div id="dash-autosave-notice" style="display:none; color: #ff9800; margin-top: 15px; cursor: pointer;">
                <i class="fa-solid fa-triangle-exclamation"></i> Recover Unsaved Session
            </div>
            <h3 style="text-align: left; margin-top: 40px; margin-bottom: 10px;">Recent Boards</h3>
            <ul id="dash-recent"></ul>
        </div>
    </div>

    <div id="toolbar">
        <button class="btn" id="btn-home" title="Dashboard"><i class="fa-solid fa-house"></i></button>
        <div class="separator"></div>

        <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="btn" id="btn-redo" title="Redo (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
        <div class="separator"></div>

        <button class="btn active" id="btn-pen" title="Pen (P)"><i class="fa-solid fa-pen"></i></button>
        <button class="btn" id="btn-eraser" title="Object Eraser (E)"><i class="fa-solid fa-eraser"></i></button>
        <button class="btn" id="btn-pixel-eraser" title="Partial Eraser"><i class="fa-solid fa-eraser" style="color: #ff9800;"></i></button>
        <button class="btn" id="btn-text" title="Text (T)"><i class="fa-solid fa-font"></i></button>
        <button class="btn" id="btn-sticky" title="Sticky Note (N)"><i class="fa-solid fa-note-sticky"></i></button>
        <button class="btn" id="btn-select" title="Select (V)"><i class="fa-solid fa-arrow-pointer"></i></button>
        <button class="btn" id="btn-pan" title="Pan (H or Hold Space)"><i class="fa-solid fa-hand"></i></button>
        <button class="btn" id="btn-laser" title="Laser Pointer (L)"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
        <div class="separator"></div>
        
        <button class="btn" id="btn-zoomin" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="btn" id="btn-zoomout" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <div class="separator"></div>

        <button class="btn" id="btn-rect" title="Square"><i class="fa-solid fa-square"></i></button>
        <button class="btn" id="btn-circle" title="Circle"><i class="fa-solid fa-circle"></i></button>
        <button class="btn" id="btn-line" title="Line"><i class="fa-solid fa-slash"></i></button>
        <div class="separator"></div>

        <input type="color" id="color-picker" value="#ffffff" title="Pick Color">
        <input type="range" id="size-picker" min="1" max="50" value="3" title="Stroke Size">
        
        <button class="btn" id="btn-dashed" title="Dashed Line"><i class="fa-solid fa-ellipsis"></i></button>
        <button class="btn" id="btn-neon" title="Neon Effect"><i class="fa-solid fa-lightbulb"></i></button>
        <div class="separator"></div>

        <button class="btn" id="btn-rows" title="Notebook Rows"><i class="fa-solid fa-bars"></i></button>
        <button class="btn" id="btn-grid" title="Notebook Grid"><i class="fa-solid fa-border-all"></i></button>
        <div class="separator"></div>

        <button class="btn" id="btn-theme" title="Toggle Theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button class="btn" id="btn-save" title="Save Project (Ctrl+S)"><i class="fa-solid fa-floppy-disk"></i></button>
    </div>

    <div id="canvas-container">
        <canvas id="board"></canvas>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const path = require('path');
        const os = require('os');

        const userDataPath = path.join(os.homedir(), 'SmartBoardData');
        if (!fs.existsSync(userDataPath)) fs.mkdirSync(userDataPath);
        const autosavePath = path.join(userDataPath, 'autosave.json');
        const recentPath = path.join(userDataPath, 'recent.json');

        const canvas = new fabric.Canvas('board', {
            isDrawingMode: true, selection: true, preserveObjectStacking: true
        });

        function resizeCanvas() {
            canvas.setWidth(window.innerWidth);
            canvas.setHeight(window.innerHeight);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const cursorEraser = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="2"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"/></svg>') 0 24, crosshair`;

        let currentMode = 'pen'; let currentTheme = 'dark';
        let isDashed = false; let isNeon = false;
        let showGrid = false; let showRows = false;
        let strokeColor = '#ffffff'; let strokeWidth = 3;
        
        let isPanning = false; let lastPanPos = { x: 0, y: 0 };
        let isErasing = false; let objectsToErase = [];
        let shiftPressed = false; let tempLine = null;
        let currentFilePath = null; let hasUnsavedChanges = false;
        
        let historyStack = []; let historyIndex = -1; let isHistoryOperating = false;

        const penBrush = new fabric.PencilBrush(canvas);
        penBrush.decimation = 2;
        canvas.freeDrawingBrush = penBrush;

        let recentBoards = [];
        if (fs.existsSync(recentPath)) {
            try { recentBoards = JSON.parse(fs.readFileSync(recentPath)); } catch(e){}
        }

        function getCanvasJSON() {
            return JSON.stringify(canvas.toJSON(['isGrid', 'globalCompositeOperation', 'selectable', 'evented']));
        }

        function updateRecentList() {
            const ul = document.getElementById('dash-recent');
            ul.innerHTML = '';
            recentBoards.forEach(filePath => {
                const li = document.createElement('li');
                li.innerHTML = `<span><i class="fa-solid fa-file-lines"></i> ${path.basename(filePath)}</span> <span style="color:gray; font-size:12px;">${filePath}</span>`;
                li.onclick = () => handleLoad(filePath);
                ul.appendChild(li);
            });
        }
        updateRecentList();

        if (fs.existsSync(autosavePath)) document.getElementById('dash-autosave-notice').style.display = 'block';

        document.getElementById('dash-new').onclick = () => {
            document.getElementById('dashboard').classList.add('hidden');
            saveState(); 
        };
        
        document.getElementById('btn-home').onclick = () => {
            document.getElementById('dashboard').classList.remove('hidden');
        };

        document.getElementById('dash-autosave-notice').onclick = () => {
            handleLoad(autosavePath);
            document.getElementById('dash-autosave-notice').style.display = 'none';
        };

        document.getElementById('dash-load').onclick = () => handleLoad();

        async function handleSave() {
            if (!currentFilePath || currentFilePath === autosavePath) {
                currentFilePath = await ipcRenderer.invoke('show-save-dialog');
                if (!currentFilePath) return;
            }
            fs.writeFileSync(currentFilePath, getCanvasJSON());
            hasUnsavedChanges = false;
            if (!recentBoards.includes(currentFilePath)) {
                recentBoards.unshift(currentFilePath);
                if(recentBoards.length > 5) recentBoards.pop();
                fs.writeFileSync(recentPath, JSON.stringify(recentBoards));
                updateRecentList();
            }
            if(fs.existsSync(autosavePath)) fs.unlinkSync(autosavePath);
        }

        async function handleLoad(filePath = null) {
            if (!filePath) {
                filePath = await ipcRenderer.invoke('show-open-dialog');
                if (!filePath) return;
            }
            if (!fs.existsSync(filePath)) return;
            
            const json = fs.readFileSync(filePath, 'utf-8');
            isHistoryOperating = true;
            canvas.loadFromJSON(json, () => {
                canvas.renderAll(); updateTheme(); isHistoryOperating = false;
                historyStack = []; historyIndex = -1; saveState();
            });
            currentFilePath = filePath !== autosavePath ? filePath : null;
            hasUnsavedChanges = false;
            document.getElementById('dashboard').classList.add('hidden');
        }

        setInterval(() => {
            if (hasUnsavedChanges && document.getElementById('dashboard').classList.contains('hidden')) {
                fs.writeFileSync(autosavePath, getCanvasJSON());
            }
        }, 10000);

        ipcRenderer.on('check-unsaved', () => { ipcRenderer.send('close-response', hasUnsavedChanges); });
        ipcRenderer.on('trigger-save-quit', async () => { await handleSave(); ipcRenderer.send('quit-app'); });

        function saveState() {
            if (isHistoryOperating || currentMode === 'laser') return;
            hasUnsavedChanges = true;
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(getCanvasJSON());
            historyIndex++;
        }

        function undo() {
            if (historyIndex > 0) {
                isHistoryOperating = true; historyIndex--;
                canvas.loadFromJSON(historyStack[historyIndex], () => { canvas.renderAll(); isHistoryOperating = false; });
            }
        }
        function redo() {
            if (historyIndex < historyStack.length - 1) {
                isHistoryOperating = true; historyIndex++;
                canvas.loadFromJSON(historyStack[historyIndex], () => { canvas.renderAll(); isHistoryOperating = false; });
            }
        }

        canvas.on('object:added', (opt) => { if (!opt.target || !opt.target.isLaser) saveState(); });
        canvas.on('object:modified', saveState);
        canvas.on('object:removed', saveState);

        function updateTheme() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            canvas.backgroundColor = currentTheme === 'dark' ? '#121212' : '#f3f3f3';
            
            const objects = canvas.getObjects();
            objects.forEach(obj => {
                const invert = (color) => {
                    if (!color) return color;
                    if (color === '#ffffff' && currentTheme === 'light') return '#000000';
                    if (color === '#000000' && currentTheme === 'dark') return '#ffffff';
                    return color;
                };
                if (obj.stroke) obj.set('stroke', invert(obj.stroke));
                if (obj.fill && obj.type !== 'path') obj.set('fill', invert(obj.fill));
                if (obj.type === 'i-text') obj.set('fill', invert(obj.fill));
            });
            strokeColor = currentTheme === 'dark' ? '#ffffff' : '#000000';
            document.getElementById('color-picker').value = strokeColor;
            updateBrush(); canvas.renderAll();
        }

        canvas.on('after:render', function() {
            if (!showGrid && !showRows) return;
            const ctx = canvas.getContext();
            const vpt = canvas.viewportTransform;
            ctx.save(); ctx.transform(vpt[0], vpt[1], vpt[2], vpt[3], vpt[4], vpt[5]);

            const zoom = canvas.getZoom();
            const width = canvas.width / zoom; const height = canvas.height / zoom;
            const offsetX = -vpt[4] / zoom; const offsetY = -vpt[5] / zoom;

            const gridColor = currentTheme === 'dark' ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 150, 255, 0.15)';
            const rowColor = currentTheme === 'dark' ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 100, 200, 0.2)';
            const marginColor = currentTheme === 'dark' ? 'rgba(255, 100, 100, 0.2)' : 'rgba(255, 0, 0, 0.3)';
            const gridSize = 40; ctx.lineWidth = 1 / zoom;

            if (showRows || showGrid) {
                ctx.beginPath(); ctx.strokeStyle = showGrid ? gridColor : rowColor;
                const startY = Math.floor(offsetY / gridSize) * gridSize;
                for (let y = startY; y < offsetY + height; y += gridSize) { ctx.moveTo(offsetX, y); ctx.lineTo(offsetX + width, y); }
                ctx.stroke();
            }

            if (showGrid) {
                ctx.beginPath(); ctx.strokeStyle = gridColor;
                const startX = Math.floor(offsetX / gridSize) * gridSize;
                for (let x = startX; x < offsetX + width; x += gridSize) { ctx.moveTo(x, offsetY); ctx.lineTo(x, offsetY + height); }
                ctx.stroke();
            } else if (showRows) {
                ctx.beginPath(); ctx.strokeStyle = marginColor;
                const marginX = offsetX + 100 / zoom;
                ctx.moveTo(marginX, offsetY); ctx.lineTo(marginX, offsetY + height);
                ctx.stroke();
            }
            ctx.restore();
        });

        function updateBrush() {
            canvas.freeDrawingBrush = penBrush;
            canvas.freeDrawingBrush.color = strokeColor;
            canvas.freeDrawingBrush.width = parseInt(strokeWidth);
            canvas.freeDrawingBrush.strokeDashArray = isDashed ? [strokeWidth * 2, strokeWidth * 2] : null;
            canvas.freeDrawingBrush.shadow = isNeon ? new fabric.Shadow({ blur: parseInt(strokeWidth) * 3, offsetX: 0, offsetY: 0, affectStroke: true, color: strokeColor }) : null;
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            const btnMap = { 'pen':'btn-pen', 'eraser':'btn-eraser', 'pixel-eraser':'btn-pixel-eraser', 'select':'btn-select', 'pan':'btn-pan', 'laser':'btn-laser' };
            if(btnMap[mode]) document.getElementById(btnMap[mode]).classList.add('active');

            canvas.isDrawingMode = (mode === 'pen' || mode === 'laser' || mode === 'pixel-eraser');
            canvas.selection = (mode === 'select');
            
            if (mode === 'select') canvas.defaultCursor = 'default';
            else if (mode === 'pan') canvas.defaultCursor = 'grab';
            else if (mode === 'eraser' || mode === 'pixel-eraser') {
                canvas.defaultCursor = cursorEraser;
                canvas.freeDrawingCursor = cursorEraser;
            }
            else canvas.defaultCursor = 'default';

            if (mode === 'laser') {
                canvas.freeDrawingBrush = penBrush;
                canvas.freeDrawingBrush.color = '#ff0000';
                canvas.freeDrawingBrush.shadow = new fabric.Shadow({ blur: 15, color: '#ff0000' });
            } else if (mode === 'pixel-eraser') {
                canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
                canvas.freeDrawingBrush.color = 'white';
                canvas.freeDrawingBrush.width = parseInt(strokeWidth) * 2;
                canvas.freeDrawingBrush.decimation = 2;
            } else if (mode === 'pen') {
                updateBrush();
            }
        }

        canvas.on('mouse:down', function(opt) {
            const evt = opt.e;
            
            if (currentMode === 'eraser') {
                isErasing = true; objectsToErase = [];
                const target = canvas.findTarget(evt, false);
                if (target && !target.isGrid) {
                    target.set('opacity', 0.3);
                    objectsToErase.push(target);
                    canvas.requestRenderAll();
                }
            }
            
            if (currentMode === 'pan' || (evt.buttons === 4) || (evt.buttons === 1 && evt.altKey) || evt.buttons === 2) {
                isPanning = true;
                let cx = evt.clientX !== undefined ? evt.clientX : (evt.touches ? evt.touches[0].clientX : 0);
                let cy = evt.clientY !== undefined ? evt.clientY : (evt.touches ? evt.touches[0].clientY : 0);
                lastPanPos = { x: cx, y: cy }; 
                canvas.defaultCursor = 'grabbing';
            }
            
            if (currentMode === 'pen' && shiftPressed) {
                canvas.isDrawingMode = false; startPoint = canvas.getPointer(opt.e);
                tempLine = new fabric.Line([startPoint.x, startPoint.y, startPoint.x, startPoint.y], { stroke: strokeColor, strokeWidth: strokeWidth, strokeDashArray: isDashed ? [strokeWidth*2, strokeWidth*2] : null });
                canvas.add(tempLine);
            }
        });

        canvas.on('mouse:move', function(opt) {
            const evt = opt.e;

            if (isErasing && currentMode === 'eraser') {
                const target = canvas.findTarget(evt, false);
                if (target && !target.isGrid && !objectsToErase.includes(target)) {
                    target.set('opacity', 0.3);
                    objectsToErase.push(target);
                    canvas.requestRenderAll();
                }
            }

            if (isPanning) {
                let cx = evt.clientX !== undefined ? evt.clientX : (evt.touches ? evt.touches[0].clientX : lastPanPos.x);
                let cy = evt.clientY !== undefined ? evt.clientY : (evt.touches ? evt.touches[0].clientY : lastPanPos.y);
                
                if (!isNaN(cx) && !isNaN(cy) && !isNaN(lastPanPos.x) && !isNaN(lastPanPos.y)) {
                    const vpt = canvas.viewportTransform;
                    vpt[4] += cx - lastPanPos.x; vpt[5] += cy - lastPanPos.y;
                    canvas.requestRenderAll(); lastPanPos = { x: cx, y: cy };
                }
            }
            
            if (currentMode === 'pen' && shiftPressed && tempLine) {
                let pointer = canvas.getPointer(opt.e);
                tempLine.set({ x2: pointer.x, y2: pointer.y }); canvas.renderAll();
            }
        });

        canvas.on('mouse:up', function() {
            if (isErasing && currentMode === 'eraser') {
                if (objectsToErase.length > 0) {
                    objectsToErase.forEach(obj => canvas.remove(obj));
                    objectsToErase = [];
                    saveState();
                }
            }

            isPanning = false; isErasing = false;
            
            if (currentMode === 'pan') canvas.defaultCursor = 'grab';
            if (currentMode === 'pen' && shiftPressed && tempLine) { canvas.isDrawingMode = true; tempLine = null; saveState(); }
        });

        canvas.on('path:created', function(opt) {
            if (currentMode === 'laser') {
                const path = opt.path; path.isLaser = true;
                setTimeout(() => {
                    fabric.util.animate({ startValue: 1, endValue: 0, duration: 500, onChange: (val) => { path.opacity = val; canvas.renderAll(); }, onComplete: () => canvas.remove(path) });
                }, 1000);
            } else if (currentMode === 'pixel-eraser') {
                const path = opt.path;
                path.globalCompositeOperation = 'destination-out';
                path.selectable = false;
                path.evented = false;
                canvas.requestRenderAll();
            }
        });

        function addShape(type) {
            const center = canvas.getCenter();
            const opts = { left: center.left, top: center.top, fill: 'transparent', stroke: strokeColor, strokeWidth: parseInt(strokeWidth) };
            let obj;
            if (type === 'rect') obj = new fabric.Rect({ ...opts, width: 100, height: 100 });
            if (type === 'circle') obj = new fabric.Circle({ ...opts, radius: 50 });
            if (type === 'line') obj = new fabric.Line([center.left-50, center.top-50, center.left+50, center.top+50], { stroke: strokeColor, strokeWidth: parseInt(strokeWidth) });
            canvas.add(obj); setMode('select');
        }

        document.getElementById('btn-undo').onclick = undo;
        document.getElementById('btn-redo').onclick = redo;
        document.getElementById('btn-rect').onclick = () => addShape('rect');
        document.getElementById('btn-circle').onclick = () => addShape('circle');
        document.getElementById('btn-line').onclick = () => addShape('line');
        document.getElementById('btn-text').onclick = () => {
            const text = new fabric.IText('Type here', { left: 100, top: 100, fill: strokeColor, fontFamily: 'Segoe UI' });
            canvas.add(text); canvas.setActiveObject(text); setMode('select');
        };
        document.getElementById('btn-sticky').onclick = () => {
            const group = new fabric.Group([
                new fabric.Rect({ width: 200, height: 200, fill: '#ffd700', rx: 10, ry: 10, shadow: new fabric.Shadow({blur: 5, color: 'rgba(0,0,0,0.3)', offsetX: 2, offsetY: 2}) }),
                new fabric.IText('Note', { left: 20, top: 20, fontSize: 20, fill: '#000' })
            ], { left: 100, top: 100 });
            canvas.add(group); setMode('select');
        };

        function doZoom(val) {
            let zoom = canvas.getZoom() * val;
            if (zoom > 20) zoom = 20; if (zoom < 0.1) zoom = 0.1;
            canvas.zoomToPoint({ x: canvas.width/2, y: canvas.height/2 }, zoom);
        }
        document.getElementById('btn-zoomin').onclick = () => doZoom(1.1);
        document.getElementById('btn-zoomout').onclick = () => doZoom(0.9);

        document.getElementById('btn-pen').onclick = () => setMode('pen');
        document.getElementById('btn-eraser').onclick = () => setMode('eraser');
        document.getElementById('btn-pixel-eraser').onclick = () => setMode('pixel-eraser');
        document.getElementById('btn-select').onclick = () => setMode('select');
        document.getElementById('btn-pan').onclick = () => setMode('pan');
        document.getElementById('btn-laser').onclick = () => setMode('laser');
        
        document.getElementById('color-picker').onchange = (e) => { strokeColor = e.target.value; updateBrush(); };
        document.getElementById('size-picker').oninput = (e) => { strokeWidth = e.target.value; updateBrush(); };
        
        document.getElementById('btn-dashed').onclick = (e) => { isDashed = !isDashed; e.currentTarget.classList.toggle('active'); updateBrush(); };
        document.getElementById('btn-neon').onclick = (e) => { isNeon = !isNeon; e.currentTarget.classList.toggle('active'); updateBrush(); };
        
        document.getElementById('btn-rows').onclick = (e) => { showRows = !showRows; showGrid = false; document.getElementById('btn-grid').classList.remove('active'); e.currentTarget.classList.toggle('active'); canvas.renderAll(); };
        document.getElementById('btn-grid').onclick = (e) => { showGrid = !showGrid; showRows = false; document.getElementById('btn-rows').classList.remove('active'); e.currentTarget.classList.toggle('active'); canvas.renderAll(); };
        
        document.getElementById('btn-theme').onclick = () => { currentTheme = currentTheme === 'dark' ? 'light' : 'dark'; updateTheme(); };
        document.getElementById('btn-save').onclick = handleSave;

        window.addEventListener('paste', (e) => {
            if (e.clipboardData.items) {
                for (let i = 0; i < e.clipboardData.items.length; i++) {
                    if (e.clipboardData.items[i].type.indexOf("image") !== -1) {
                        const source = window.URL.createObjectURL(e.clipboardData.items[i].getAsFile());
                        fabric.Image.fromURL(source, (img) => { img.set({ left: 100, top: 100 }); img.scaleToWidth(400); canvas.add(img); setMode('select'); });
                    }
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Shift') shiftPressed = true;
            if (e.ctrlKey && (e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'x')) { undo(); e.preventDefault(); }
            if (e.ctrlKey && e.key.toLowerCase() === 'y') { redo(); e.preventDefault(); }
            if (e.ctrlKey && e.key.toLowerCase() === 's') { handleSave(); e.preventDefault(); }
            if (e.key.toLowerCase() === 'p' && !e.ctrlKey) setMode('pen');
            if (e.key.toLowerCase() === 'e' && !e.ctrlKey) setMode('eraser');
            if (e.key.toLowerCase() === 'v' && !e.ctrlKey) setMode('select');
            if (e.key.toLowerCase() === 'h' && !e.ctrlKey) setMode('pan');
            if (e.key.toLowerCase() === 't' && !e.ctrlKey) document.getElementById('btn-text').click();
            if (e.key.toLowerCase() === 'n' && !e.ctrlKey) document.getElementById('btn-sticky').click();
            if (e.key.toLowerCase() === 'l' && !e.ctrlKey) setMode('laser');
            if (e.code === 'Space' && currentMode !== 'pan') { canvas.defaultCursor = 'grab'; isPanning = true; }
            if ((e.key === 'Delete' || e.key === 'Backspace') && currentMode === 'select') {
                const activeObjects = canvas.getActiveObjects();
                if (activeObjects.length) { activeObjects.forEach(obj => canvas.remove(obj)); canvas.discardActiveObject(); saveState(); }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Shift') shiftPressed = false;
            if (e.code === 'Space') { isPanning = false; setMode(currentMode); }
        });

        canvas.on('mouse:wheel', function(opt) {
            if (opt.e.ctrlKey) {
                const delta = opt.e.deltaY; let zoom = canvas.getZoom() * (0.999 ** delta);
                if (zoom > 20) zoom = 20; if (zoom < 0.1) zoom = 0.1;
                canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
            } else {
                const vpt = canvas.viewportTransform;
                const scrollSpeedMultiplier = 4;
                vpt[4] -= (opt.e.deltaX || 0) * scrollSpeedMultiplier;
                vpt[5] -= (opt.e.deltaY || 0) * scrollSpeedMultiplier;
                canvas.requestRenderAll();
            }
            opt.e.preventDefault(); opt.e.stopPropagation();
        });

        updateTheme();
    </script>
</body>
</html>
